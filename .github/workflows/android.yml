name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the installable test-build prerelease
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode is the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and release build
        run: ./gradlew --no-daemon test lintDebug assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "clu-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: clu-apk
          path: clu-*.apk

      # A prerelease per branch, so the APK downloads straight onto a phone (no zip).
      - name: Publish installable test build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" clu-*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Clu test build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Test-signed build for sideloading onto a test phone. Install the APK, then follow README > Getting started (and docs/POCO_X7_PRO.md on Xiaomi/POCO)."
